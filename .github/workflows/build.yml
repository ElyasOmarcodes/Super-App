name: build

# Produces installable binaries for Android, Windows and iOS, then re-packs
# each one as an .tar.xz archive compressed with LZMA2 at its extreme preset.
# GitHub always serves artifacts inside a zip envelope; putting an already
# maximally-compressed .tar.xz inside that zip is what keeps the download small.

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.38.0'
  XZ_OPT: '-9e --threads=0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------- analysis
  check:
    name: analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: install dependencies
        working-directory: app
        run: flutter pub get
      - name: verify formatting
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib test
      - name: analyze
        working-directory: app
        run: flutter analyze --fatal-infos
      - name: test
        working-directory: app
        run: flutter test

  # ---------------------------------------------------------------- android
  android:
    name: android
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: install dependencies
        working-directory: app
        run: flutter pub get

      # --split-per-abi keeps each APK to one architecture, which removes the
      # other two copies of the Flutter engine from every download.
      - name: build apks
        working-directory: app
        run: |
          flutter build apk --release --split-per-abi \
            --obfuscate --split-debug-info=build/symbols \
            --tree-shake-icons
          flutter build appbundle --release \
            --obfuscate --split-debug-info=build/symbols \
            --tree-shake-icons

      - name: pack
        run: |
          mkdir -p out
          cp app/build/app/outputs/flutter-apk/*.apk out/
          cp app/build/app/outputs/bundle/release/*.aab out/
          tar -C out -cf - . | xz -9e --threads=0 > qamus-android.tar.xz
          ls -lh out qamus-android.tar.xz

      - uses: actions/upload-artifact@v4
        with:
          name: qamus-android
          path: qamus-android.tar.xz
          compression-level: 0        # the payload is already xz'd
          if-no-files-found: error

  # ---------------------------------------------------------------- windows
  windows:
    name: windows
    needs: check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: install dependencies
        working-directory: app
        run: flutter pub get

      # Flutter picks the CMake generator from whatever Visual Studio it finds
      # through vswhere, and silently falls back to "Visual Studio 16 2019"
      # when it finds nothing — which then fails with a confusing error. Print
      # both views so a detection failure is obvious in the log.
      - name: report toolchain
        shell: bash
        run: |
          "$PROGRAMFILES (x86)/Microsoft Visual Studio/Installer/vswhere.exe" \
            -products '*' -prerelease -format value \
            -property installationVersion || echo 'vswhere found nothing'
          flutter doctor -v

      - name: build
        working-directory: app
        run: >
          flutter build windows --release
          --obfuscate --split-debug-info=build/symbols
          --tree-shake-icons

      - name: pack
        shell: bash
        run: |
          # Several Release directories exist under build/windows (each plugin
          # gets one); only the runner's holds the executable and its bundle.
          release=app/build/windows/x64/runner/Release
          [ -d "$release" ] || release=$(find app/build/windows -type d -path '*runner/Release' | head -n 1)
          [ -x "$release/qamus.exe" ] || { echo "no runner bundle at $release"; exit 1; }
          mkdir -p out/qamus
          cp -r "$release"/* out/qamus/
          rm -f out/qamus/*.pdb
          tar -C out -cf - . | xz -9e --threads=0 > qamus-windows.tar.xz
          ls -lh qamus-windows.tar.xz

      - uses: actions/upload-artifact@v4
        with:
          name: qamus-windows
          path: qamus-windows.tar.xz
          compression-level: 0
          if-no-files-found: error

  # -------------------------------------------------------------------- ios
  ios:
    name: ios
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: install dependencies
        working-directory: app
        run: flutter pub get

      # Unsigned: a signed build needs a paid Apple team, so CI produces the
      # .app that a developer can sign locally or that sideloaders accept.
      - name: build
        working-directory: app
        run: >
          flutter build ios --release --no-codesign
          --obfuscate --split-debug-info=build/symbols
          --tree-shake-icons

      - name: pack
        run: |
          mkdir -p out/Payload
          cp -R app/build/ios/iphoneos/Runner.app out/Payload/
          (cd out && zip -0 -qry ../qamus-unsigned.ipa Payload)
          rm -rf out
          mkdir -p out && mv qamus-unsigned.ipa out/
          tar -C out -cf - . | xz -9e --threads=0 > qamus-ios.tar.xz
          ls -lh qamus-ios.tar.xz

      - uses: actions/upload-artifact@v4
        with:
          name: qamus-ios
          path: qamus-ios.tar.xz
          compression-level: 0
          if-no-files-found: error

  # ------------------------------------------------------------------ release
  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: publish
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.tar.xz
          generate_release_notes: true
